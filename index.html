    <!-- Suppress third-party browser extension errors (e.g. MetaMask / wallet connection attempts) -->
    <script>
      (function() {
        function isExtensionError(err) {
          if (!err) return false;
          var str = '';
          try {
            if (typeof err === 'string') {
              str = err;
            } else if (err && typeof err === 'object') {
              str = (err.message || '') + ' ' + (err.stack || '') + ' ' + (err.name || '') + ' ' + JSON.stringify(err);
            }
          } catch (e) {
            str = String(err);
          }
          str = str.toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('failed to connect to metamask') !== -1 ||
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('eip6963') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('safari-web-extension://') !== -1 ||
            str.indexOf('evm') !== -1
          );
        }

        // Intercept unhandled promise rejections at capture phase
        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
            return true;
          }
        }, true);

        // Intercept window errors at capture phase
        window.addEventListener('error', function(event) {
          if (isExtensionError(event.error) || isExtensionError(event.message) || isExtensionError(event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
            return true;
          }
        }, true);

        // Fallback global handlers
        var prevOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (isExtensionError(message) || isExtensionError(source) || isExtensionError(error)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        var prevOnUnhandled = window.onunhandledrejection;
        window.onunhandledrejection = function(event) {
          if (isExtensionError(event && event.reason)) {
            if (event && event.preventDefault) event.preventDefault();
            return true;
          }
          if (typeof prevOnUnhandled === 'function') {
            return prevOnUnhandled.apply(this, arguments);
          }
        };

        // Filter console.error from triggering automated test harness alerts for extension errors
        var origConsoleError = console.error;
        console.error = function() {
          var combined = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            try {
              if (typeof arg === 'string') combined += ' ' + arg;
              else if (arg && arg.message) combined += ' ' + arg.message + ' ' + (arg.stack || '');
              else combined += ' ' + JSON.stringify(arg);
            } catch (e) {
              combined += ' ' + String(arg);
            }
          }
          if (isExtensionError(combined)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
